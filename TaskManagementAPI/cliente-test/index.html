<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Notificaciones de Tareas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <!-- SignalR -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>

  <style>
    body {
      background-color: #f4f6f9;
      font-family: 'Segoe UI', sans-serif;
    }

    .task-container {
      max-width: 700px;
      margin: 60px auto;
      padding: 30px;
      background-color: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
    }

    .task-card {
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .task-title {
      font-weight: 600;
      font-size: 1.1rem;
    }

    .timestamp {
      font-size: 0.8rem;
      color: #6c757d;
    }

    .header-icon {
      font-size: 1.6rem;
      color: #0d6efd;
      margin-right: 10px;
    }
  </style>
</head>
<body>

  <div class="container task-container">
    <div class="d-flex align-items-center mb-4">
      <i class="bi bi-card-checklist header-icon"></i>
      <h3 class="m-0">Tareas Recientes</h3>
    </div>

    <div id="taskList" class="d-grid gap-3"></div>
  </div>

  <script>
    const connection = new signalR.HubConnectionBuilder()
      .withUrl("https://localhost:7158/taskHub")
      .build();

    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleString('es-DO', {
        weekday: 'short',
        day: '2-digit',
        month: 'short',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function getBadge(status) {
      let color = "secondary";
      if (status.toLowerCase().includes("pendiente")) color = "warning";
      else if (status.toLowerCase().includes("completada")) color = "success";
      else if (status.toLowerCase().includes("retrasada")) color = "danger";
      return `<span class="badge bg-${color} text-capitalize">${status}</span>`;
    }

    connection.on("TaskCreated", task => {
      const taskList = document.getElementById("taskList");

      const card = document.createElement("div");
      card.className = "border-start border-4 border-primary bg-light p-3 rounded task-card";

      card.innerHTML = `
        <div class="d-flex justify-content-between align-items-start mb-2">
          <div class="d-flex align-items-center">
            <i class="bi bi-clipboard-check-fill me-2 text-primary"></i>
            <div class="task-title">${task.description}</div>
          </div>
          ${getBadge(task.status || "sin estado")}
        </div>
        <div class="text-muted mb-1">
          <i class="bi bi-info-circle me-1"></i>${task.extraData || ""}
        </div>
        <div class="timestamp mt-1">
          <i class="bi bi-calendar-event me-1"></i>Vence: ${formatDate(task.dueDate)}
        </div>
      `;

      taskList.prepend(card);
    });

    connection.start()
      .then(() => console.log("✅ Conectado a SignalR"))
      .catch(err => console.error("❌ Error de conexión:", err));
  </script>

</body>
</html>
